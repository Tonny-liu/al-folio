<text x="648" y="956" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="400" fill="#655e6e" letter-spacing="0"><tspan x="648" dy="0">Write and revise LaTeX</tspan><tspan x="648" dy="90.88">documents in a shared editor,</tspan><tspan x="648" dy="90.88">with a live preview of the</tspan><tspan x="648" dy="90.88">manuscript.</tspan></text>
